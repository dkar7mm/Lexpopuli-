name: Autoclose Laws

on:
  schedule:
    - cron: '30 2 * * *'  # Codziennie o 2:30 UTC (po backupie)
  workflow_dispatch:

jobs:
  autoclose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: lexpopuli
        run: npm install @neondatabase/serverless dotenv

      - name: Run autoclose
        working-directory: lexpopuli
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node autoclose.mjs
