name: Daily Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BACKUP_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: lexpopuli
        run: npm install @neondatabase/serverless dotenv

      - name: Run backup
        working-directory: lexpopuli
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node backup.mjs

      - name: Commit and push backup
        run: |
          git config --global user.name 'Lex Populi Backup'
          git config --global user.email 'backup@superanum.org'
          git add lexpopuli/backups/
          git diff --staged --quiet || git commit -m "backup: $(date +%Y-%m-%d)"
          git push
